<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Plant-sitting schedule · Plantaroo</title>
<style>
  :root {
    --bg: #000; --surface: #111116; --elev: #1c1c24; --border: rgba(255,255,255,.07);
    --text: #f5f5f7; --muted: #8a8a92; --faint: #555; --green: #30d158; --greenbg: rgba(48,209,88,.16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 48px; line-height: 1.4;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 0; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.5px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .daylabel {
    color: var(--faint); font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .6px; margin: 22px 2px 8px;
  }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .row + .row { border-top: 1px solid var(--border); }
  .thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: none; background: var(--elev); }
  .ph {
    width: 44px; height: 44px; border-radius: 10px; flex: none; display: flex; align-items: center;
    justify-content: center; font-weight: 600; font-size: 18px; color: var(--green); background: var(--greenbg);
  }
  .name { font-size: 15px; font-weight: 500; }
  .room { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .meta { flex: 1; min-width: 0; }
  .btn {
    flex: none; border: 1px solid var(--green); background: transparent; color: var(--green);
    font-size: 14px; font-weight: 600; border-radius: 100px; padding: 8px 16px; cursor: pointer;
  }
  .btn.done { background: var(--green); color: #000; border-color: var(--green); }
  .btn:disabled { opacity: 1; }
  .empty, .loading, .error { color: var(--muted); text-align: center; padding: 60px 20px; }
  .footer { color: var(--faint); font-size: 12px; text-align: center; margin-top: 36px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading" id="status">Loading schedule…</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, signInAnonymously }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const firebaseConfig = {
  apiKey: 'AIzaSyBfQ0-PFAaglQvowhD4uh17QAYrqBiqMtA',
  authDomain: 'plantaroo-204ca.firebaseapp.com',
  projectId: 'plantaroo-204ca',
  storageBucket: 'plantaroo-204ca.firebasestorage.app',
  messagingSenderId: '870788325984',
  appId: '1:870788325984:web:ebf0121f07cec2b4175905',
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(location.search);
const uid = params.get('u');
const token = params.get('t');
const app$ = document.getElementById('app');
const status$ = document.getElementById('status');

function fail(msg) { status$.className = 'error'; status$.textContent = msg; }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

function dayLabel(ymd) {
  const [y, m, d] = ymd.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((date - today) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  return date.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}

(async () => {
  if (!uid || !token) { fail('This link is missing its schedule details.'); return; }
  try { await signInAnonymously(auth); } catch (_) { /* check-off may not work, viewing still does */ }

  let share;
  try {
    const snap = await getDoc(doc(db, 'public', uid, 'shares', token));
    if (!snap.exists()) { fail('This schedule is no longer available. Ask for a fresh link.'); return; }
    share = snap.data();
  } catch (e) { fail('Could not load the schedule. Check your connection and try again.'); return; }

  if (share.status === 'revoked') { fail('This schedule has been turned off by its owner.'); return; }

  // Build a day -> [plant] map across the window.
  const byDay = {};
  for (const p of (share.plants || [])) {
    for (const ymd of (p.dueDates || [])) {
      (byDay[ymd] = byDay[ymd] || []).push(p);
    }
  }
  const days = Object.keys(byDay).sort();

  const owner = esc(share.ownerName || 'Your friend');
  let html = `<h1>${owner}'s plants</h1>`
    + `<p class="sub">Thanks for plant-sitting! Tap a plant when you've watered it.</p>`;

  if (days.length === 0) {
    html += `<div class="empty">Nothing needs water in this period. 🌿</div>`;
  } else {
    for (const ymd of days) {
      html += `<div class="daylabel">${esc(dayLabel(ymd))}</div><div class="card">`;
      for (const p of byDay[ymd]) {
        const key = `${token}:${p.id}:${ymd}`;
        const done = localStorage.getItem('pl_'+key) === '1';
        const thumb = p.photo
          ? `<img class="thumb" src="${esc(p.photo)}" alt="" />`
          : `<div class="ph">${esc((p.name || '?').trim().charAt(0).toUpperCase())}</div>`;
        html += `<div class="row" data-pid="${p.id}" data-ymd="${esc(ymd)}">`
          + thumb
          + `<div class="meta"><div class="name">${esc(p.name)}</div>`
          + (p.room ? `<div class="room">${esc(p.room)}</div>` : '')
          + `</div>`
          + `<button class="btn ${done ? 'done' : ''}" ${done ? 'disabled' : ''}>`
          + `${done ? 'Watered' : 'Water'}</button></div>`;
      }
      html += `</div>`;
    }
  }
  html += `<div class="footer">Powered by Plantaroo</div>`;
  app$.innerHTML = html;

  app$.querySelectorAll('.row').forEach((row) => {
    const btn = row.querySelector('.btn');
    if (btn.disabled) return;
    btn.addEventListener('click', async () => {
      const pid = Number(row.dataset.pid);
      const ymd = row.dataset.ymd;
      btn.disabled = true; btn.textContent = '…';
      try {
        // Deterministic id per (plant, scheduled day) → idempotent check-off.
        const evId = `${pid}-${ymd}`;
        await setDoc(doc(db, 'public', uid, 'shares', token, 'events', evId), {
          plantId: pid,
          type: 'Watered',
          date: new Date().toISOString(), // the real watering moment
          at: new Date().toISOString(),
        });
        localStorage.setItem('pl_'+`${token}:${pid}:${ymd}`, '1');
        btn.classList.add('done'); btn.textContent = 'Watered';
      } catch (e) {
        // Already recorded (re-tap) is fine; otherwise show it's done anyway.
        localStorage.setItem('pl_'+`${token}:${pid}:${ymd}`, '1');
        btn.classList.add('done'); btn.textContent = 'Watered';
      }
    });
  });
})();
</script>
</body>
</html>
